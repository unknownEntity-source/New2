<!DOCTYPE html>
<html>
<head>
    <title>My Website</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: lightblue;
            padding: 50px;
        }

        h1 {
            color: darkblue;
        }

        button {
            padding: 12px 25px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <h1>Hello World!</h1>

    <p>Welcome to my first website.</p>

    <button onclick="sayHello()">Click Me</button>

    <script>
        function sayHello() {
            alert("Hello! You made a real website!");
        }
    </script>

</body>
</html>
